# Destroy every datastore this path manages. Manual only.
#
# There is no trigger other than workflow_dispatch: nothing in a push or a
# pull request can reach this. The confirmation input exists so that running
# it is a deliberate act and not a misclick in the Actions tab.
name: datastore teardown

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to confirm. Every datastore in this path will be deleted.'
        required: true
        type: string
      reason:
        description: 'Why (recorded in the run summary)'
        required: false
        type: string
        default: 'end of demo'

permissions:
  id-token: write
  contents: read

# Share the apply workflow's concurrency group: a teardown and an apply must
# never run at the same time.
concurrency:
  group: datastore-apply
  cancel-in-progress: false

jobs:
  confirm:
    name: check the confirmation
    runs-on: ubuntu-latest
    steps:
      - name: The confirmation must be exactly "destroy"
        run: |
          if [ "${{ inputs.confirm }}" != "destroy" ]; then
            echo "Confirmation was '${{ inputs.confirm }}', not 'destroy'. Nothing was touched." >&2
            exit 1
          fi
          {
            echo '# Teardown'
            echo ''
            echo "Requested by @${{ github.actor }}."
            echo ''
            echo "Reason: ${{ inputs.reason }}"
          } >> "$GITHUB_STEP_SUMMARY"

  teardown:
    name: destroy every datastore
    needs: confirm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: paths/compliant-datastore/terraform

    steps:
      - name: Check out main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Read the Terraform version from .tool-versions
        id: tooling
        working-directory: .
        run: |
          version="$(awk '$1 == "terraform" { print $2 }' .tool-versions)"
          if [ -z "$version" ]; then
            echo "no terraform entry in .tool-versions" >&2
            exit 1
          fi
          echo "terraform=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ steps.tooling.outputs.terraform }}

      - name: Assume the apply role
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: datastore-teardown-${{ github.run_id }}

      - name: terraform init
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: terraform destroy
        env:
          TF_VAR_kms_key_arn: ${{ vars.DATASTORE_KMS_KEY_ARN }}
          TF_VAR_db_subnet_group_name: ${{ vars.DATASTORE_DB_SUBNET_GROUP_NAME }}
          TF_VAR_vpc_id: ${{ vars.DATASTORE_VPC_ID }}
          TF_VAR_region: ${{ vars.AWS_REGION }}
        run: terraform destroy -auto-approve -no-color -lock-timeout=10m

      - name: Record what was destroyed
        if: always()
        run: |
          {
            echo ''
            echo 'Every datastore managed by this path has been destroyed.'
            echo 'The request files are untouched: re-running the apply workflow rebuilds them.'
          } >> "$GITHUB_STEP_SUMMARY"
